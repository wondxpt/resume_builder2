name: Build Android APK

# Runs automatically whenever you push code to the main branch,
# and can also be triggered manually from the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install autotools (needed by some python-for-android recipes)
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool libtool-bin pkg-config

      - name: Build the APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload the built APK
        uses: actions/upload-artifact@v4
        with:
          name: resume-builder-apk
          path: ${{ steps.buildozer.outputs.filename }}
