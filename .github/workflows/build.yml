name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            build-essential \
            zlib1g-dev libssl-dev \
            libffi-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            openjdk-17-jdk
          sudo apt clean

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36
          pip install buildozer==1.5.0
          pip install setuptools

      - name: Clean broken cache
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

      - name: Download and install Android SDK manually with license acceptance
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk
          cd ~/.buildozer/android/platform/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-6514223_latest.zip
          unzip -q commandlinetools-linux-6514223_latest.zip
          rm commandlinetools-linux-6514223_latest.zip
          mkdir -p cmdline-tools/latest
          mv tools/* cmdline-tools/latest/
          rmdir tools
          export PATH=$PATH:$PWD/cmdline-tools/latest/bin
          echo "yes | sdkmanager --licenses --sdk_root=$PWD" | bash
          sdkmanager --sdk_root=$PWD "platform-tools" "platforms;android-31" "build-tools;37.0.0"

      - name: Build with Buildozer
        run: |
          export ANDROIDSDK=/home/runner/.buildozer/android/platform/android-sdk
          export ANDROIDNDK=/home/runner/.buildozer/android/platform/android-ndk-r28c
          export ANDROIDAPI=31
          export ANDROIDMINAPI=21
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: resume-builder-apk
          path: bin/*.apk
