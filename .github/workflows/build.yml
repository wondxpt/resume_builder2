name: Build Resume Builder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # Get project
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Python 3.11
      # --------------------------------------------------

      - name: Setup Python 3.11.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.7'
          cache: 'pip'


      - name: Verify Python
        run: |
          python --version
          python -c "import sys; print(sys.version)"
          which python


      # --------------------------------------------------
      # Java / Android dependencies
      # --------------------------------------------------

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake


      - name: Verify Java
        run: |
          java -version
          javac -version


      # --------------------------------------------------
      # Buildozer
      # --------------------------------------------------

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer==1.5.0 \
            Cython==0.29.34 \
            virtualenv


      - name: Verify Buildozer
        run: |
          python --version
          buildozer --version


      # --------------------------------------------------
      # Clean previous Android build
      # --------------------------------------------------

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin


      # --------------------------------------------------
      # Build APK
      # --------------------------------------------------

      - name: Build APK
        run: |
          buildozer -v android debug


      # --------------------------------------------------
      # Verify APK
      # --------------------------------------------------

      - name: Verify APK
        run: |
          echo "APK files:"
          ls -lah bin/

          echo "APK information:"
          file bin/*.apk


      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Resume-Builder-APK
          path: bin/*.apk
          if-no-files-found: error
