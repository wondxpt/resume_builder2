name: Build Resume Builder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build-apk:

    runs-on: ubuntu-22.04

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # PYTHON 3.11.7
      # ==================================================

      - name: Setup Python 3.11.7
        uses: actions/setup-python@v6
        with:
          python-version: '3.11.7'


      - name: Verify Python
        run: |
          python --version
          python -c "import sys; print(sys.version)"
          which python


      # ==================================================
      # SYSTEM DEPENDENCIES
      # ==================================================

      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake


      # ==================================================
      # JAVA
      # ==================================================

      - name: Verify Java
        run: |
          java -version
          javac -version


      # ==================================================
      # BUILD DEPENDENCIES
      # ==================================================

      - name: Install Buildozer
        run: |

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            buildozer==1.5.0 \
            Cython==0.29.34 \
            virtualenv


      # ==================================================
      # VERIFY BUILD TOOLS
      # ==================================================

      - name: Verify Buildozer
        run: |

          python --version

          buildozer --version


      # ==================================================
      # VERIFY LOCAL REPORTLAB RECIPE
      # ==================================================

      - name: Verify ReportLab recipe
        run: |

          echo "Checking local recipe..."

          test -f p4a-recipes/reportlab/__init__.py

          echo "Recipe found:"
          cat p4a-recipes/reportlab/__init__.py


      # ==================================================
      # CLEAN PREVIOUS BUILD
      # ==================================================

      - name: Clean previous Android build
        run: |

          rm -rf .buildozer
          rm -rf bin


      # ==================================================
      # BUILD APK
      # ==================================================

      - name: Build APK
        run: |

          buildozer -v android debug


      # ==================================================
      # VERIFY APK
      # ==================================================

      - name: Verify APK
        run: |

          echo "======================================"
          echo "APK files:"
          echo "======================================"

          ls -lah bin/

          echo "======================================"
          echo "APK information:"
          echo "======================================"

          file bin/*.apk


      # ==================================================
      # UPLOAD APK
      # ==================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:
          name: Resume-Builder-APK
          path: bin/*.apk
          if-no-files-found: error
