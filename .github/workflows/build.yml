name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
          autoconf \
          automake \
          libtool \
          libtool-bin \
          pkg-config \
          build-essential \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          libffi-dev \
          libssl-dev \
          zlib1g-dev \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev


      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install setuptools
          pip install cython==0.29.36
          pip install buildozer==1.5.0


      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer

          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

          restore-keys: |
            buildozer-${{ runner.os }}-


      # مهم: حذف recipe خراب ReportLab
      - name: Remove broken reportlab recipe
        run: |

          P4A=$(find ~/.buildozer -type d -name "python-for-android" | head -1)

          echo "P4A PATH:"
          echo $P4A

          if [ -d "$P4A/pythonforandroid/recipes/reportlab" ]; then

            rm -rf "$P4A/pythonforandroid/recipes/reportlab"

            echo "Reportlab recipe removed"

          else

            echo "Reportlab recipe not found"

          fi



      - name: Build APK
        env:
          ANDROIDAPI: 31
          ANDROIDMINAPI: 24
          ANDROIDNDK: 28c

        run: |

          yes | buildozer android debug -v



      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: resume-builder-apk

          path: bin/*.apk
