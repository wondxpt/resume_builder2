name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.7"



      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"



      - name: Install system dependencies
        run: |

          sudo apt update

          sudo apt install -y \
          autoconf \
          automake \
          libtool \
          libtool-bin \
          pkg-config \
          build-essential \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          libffi-dev \
          libssl-dev \
          zlib1g-dev \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev



      - name: Install Python build tools
        run: |

          python -m pip install --upgrade pip

          pip install \
          setuptools \
          wheel \
          buildozer==1.5.0 \
          cython==0.29.36



      - name: Accept Android licenses
        run: |

          yes | sdkmanager --licenses || true



      - name: Remove old Buildozer cache
        run: |

          rm -rf ~/.buildozer



      - name: Create Buildozer directory
        run: |

          mkdir -p ~/.buildozer



      - name: Build APK
        env:

          P4A_RELEASE_KEYSTORE: ""

        run: |

          yes | buildozer android clean

          yes | buildozer -v android debug



      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: resume-builder-apk

          path: bin/*.apk
