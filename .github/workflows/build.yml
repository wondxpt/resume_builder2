name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:


      - name: Checkout
        uses: actions/checkout@v4



      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"



      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"



      - name: Install dependencies
        run: |

          sudo apt update

          sudo apt install -y \
          build-essential \
          git \
          zip \
          unzip \
          autoconf \
          automake \
          libtool \
          pkg-config \
          libffi-dev \
          libssl-dev \
          zlib1g-dev \
          openjdk-17-jdk \
          wget



      - name: Install Android SDK packages
        run: |

          yes | sdkmanager --licenses || true

          sdkmanager \
          "platform-tools" \
          "platforms;android-31" \
          "build-tools;31.0.0"



      - name: Install Buildozer
        run: |

          pip install --upgrade pip

          pip install setuptools

          pip install cython==0.29.36

          pip install buildozer==1.5.0




      - name: Cache Buildozer
        uses: actions/cache@v4

        with:

          path:

            ~/.buildozer

          key:

            buildozer-${{ hashFiles('buildozer.spec') }}

          restore-keys:

            buildozer-



      # جایگزینی دانلود خراب freetype

      - name: Fix freetype download

        run: |

          mkdir -p ~/.buildozer/android/platform/packages/freetype


          wget -O ~/.buildozer/android/platform/packages/freetype/freetype-2.14.1.tar.gz \
          https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz || true





      - name: Build APK

        run: |

          buildozer -v android debug



      - name: Upload APK

        uses: actions/upload-artifact@v4

        with:

          name: resume-builder-apk

          path: bin/*.apk
